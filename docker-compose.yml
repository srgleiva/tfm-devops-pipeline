# Entorno local completo: PostgreSQL + aplicación.
#   docker compose up --build      -> app en http://localhost:8080
#   docker compose up -d db        -> solo la base de datos (para desarrollar con dotnet run / npm run dev)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tfm
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm -d tfm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      ConnectionStrings__db: "Host=db;Port=5432;Database=tfm;Username=tfm;Password=tfm"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

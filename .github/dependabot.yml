# Actualización automática de dependencias: como máximo un pull request por ecosistema cada semana
# (todas las actualizaciones de cada ecosistema van agrupadas en el mismo PR).
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /api
      - /tests/Api.UnitTests
      - /tests/Api.IntegrationTests
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    # El proyecto se mantiene en .NET 10 (LTS): no proponer saltos a .NET 11 o posteriores.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
